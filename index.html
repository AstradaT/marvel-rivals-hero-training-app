<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marvel Rivals Roulette</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Animación de parpadeo para el efecto de carga */
        @keyframes pulse-fast {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .anim-ticking { animation: pulse-fast 0.1s infinite; }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen lg:h-dvh lg:overflow-y-hidden flex flex-col items-center justify-center font-sans py-4 lg:py-3">

    <main class="text-center max-w-md lg:max-w-5xl w-full px-4 lg:px-6">
        <!-- Mute Toggle Button -->
        <div class="flex justify-between lg:justify-end lg:gap-3 mb-4">
            <button id="ban-list-btn" class="px-3 py-2 rounded-lg bg-slate-900 border border-slate-800 hover:border-slate-600 text-slate-300 cursor-pointer transition-all active:scale-95 text-xs font-bold uppercase tracking-wider" aria-haspopup="dialog" aria-controls="ban-modal">
                Ban List <span id="ban-count" class="text-red-400">0</span>
            </button>
            <button id="mute-btn" class="p-2 rounded-lg bg-slate-900 border border-slate-800 hover:border-slate-600 text-slate-400 cursor-pointer transition-all active:scale-95 flex items-center justify-center" title="Toggle Sound">
                <!-- Speaker Icon (SVG) -->
                <svg id="mute-icon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path id="audio-wave-1" d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                    <path id="audio-wave-2" d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                </svg>
            </button>
        </div>

        <div class="lg:grid lg:grid-cols-[minmax(0,1fr)_minmax(360px,0.85fr)] lg:grid-rows-[auto_auto_auto_auto] lg:gap-x-8 lg:gap-y-4 lg:items-center">
        <!-- Role Filters (Multiselect con Íconos) -->
        <div class="flex justify-center gap-3 mb-6 lg:mb-0 lg:col-start-2 lg:row-start-1 lg:self-end">
            <!-- Vanguard Button -->
            <button data-role="Vanguard" class="role-btn flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider bg-slate-900 text-blue-400 border-2 border-blue-500 shadow-md shadow-blue-950/50 cursor-pointer transition-all active:scale-95">
                <img src="assets/icon-vanguard.webp" alt="Vanguard" class="w-4 h-4 object-contain">
                Vanguard
            </button>
            <!-- Duelist Button -->
            <button data-role="Duelist" class="role-btn flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider bg-slate-900 text-red-400 border-2 border-red-500 shadow-md shadow-red-950/50 cursor-pointer transition-all active:scale-95">
                <img src="assets/icon-duelist.webp" alt="Duelist" class="w-4 h-4 object-contain">
                Duelist
            </button>
            <!-- Strategist Button -->
            <button data-role="Strategist" class="role-btn flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider bg-slate-900 text-emerald-400 border-2 border-emerald-500 shadow-md shadow-emerald-950/50 cursor-pointer transition-all active:scale-95">
                <img src="assets/icon-strategist.webp" alt="Strategist" class="w-4 h-4 object-contain">
                Strategist
            </button>
        </div>

        <p id="selection-message" class="hidden text-sm text-red-400 mb-4 lg:mb-0 lg:col-start-2 lg:row-start-2" role="alert"></p>

        <!-- Contenedor del Héroe (Resolución Estricta 1:1) -->
        <div id="card-container" class="bg-slate-900 border-4 border-slate-700 rounded-2xl p-6 lg:p-4 shadow-2xl transition-all duration-300 transform mb-8 lg:mb-0 lg:col-start-1 lg:row-start-1 lg:row-span-4 lg:self-center lg:w-full lg:max-w-[460px]">
            <a id="hero-page-link" class="group w-full aspect-square flex items-center justify-center overflow-hidden rounded-lg bg-slate-950/50 mb-4 relative pointer-events-none focus:outline-none focus:ring-2 focus:ring-amber-400" target="_blank" rel="noopener noreferrer" aria-disabled="true" tabindex="-1">
                <img id="hero-img" src="https://placehold.co/300x300/1e293b/ffffff?text=?" alt="Selected Hero" class="w-full h-full object-cover transition-all duration-150 group-hover:scale-[1.02]">
                <span id="hero-page-hint" class="hidden absolute bottom-3 right-3 bg-slate-950/85 border border-slate-600 rounded-lg px-3 py-2 text-[10px] font-bold uppercase tracking-wider text-white shadow-lg group-hover:border-amber-400 group-hover:text-amber-300 transition-colors">
                    Official Hero Page &#8599;
                </span>
            </a>
            
            <h2 id="hero-name" class="text-2xl font-bold tracking-wide">Who will step up?</h2>
            <p id="hero-role" class="text-sm font-semibold tracking-widest uppercase text-slate-500 mt-1">-</p>
        </div>

        <!-- Practice Block -->
        <section id="practice-panel" class="hidden mb-4 lg:mb-0 bg-slate-900/80 border border-slate-700 rounded-xl p-4 text-left lg:col-start-2 lg:row-start-3">
            <div class="flex items-center justify-between gap-4 mb-3">
                <div>
                    <p class="text-xs uppercase tracking-widest text-slate-500 font-bold">Practice block</p>
                    <p id="practice-status" class="text-sm text-slate-300 mt-1">0 of 3 matches completed</p>
                </div>
                <span id="practice-count" class="text-2xl font-black text-amber-400 whitespace-nowrap shrink-0">0 / 3</span>
            </div>

            <div class="w-full h-2 bg-slate-800 rounded-full overflow-hidden mb-4">
                <div id="practice-progress" class="h-full bg-gradient-to-r from-red-500 to-amber-400 transition-all duration-300" style="width: 0%"></div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <button id="match-complete-btn" class="bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-800 disabled:text-slate-600 text-white font-bold py-3 px-3 rounded-lg uppercase tracking-wide text-xs transition-all cursor-pointer disabled:cursor-not-allowed">
                    Match Complete
                </button>
                <button id="extend-btn" class="bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-slate-200 font-bold py-3 px-3 rounded-lg uppercase tracking-wide text-xs transition-all cursor-pointer disabled:cursor-not-allowed">
                    Extend to 5
                </button>
            </div>
        </section>

        <!-- Botón de Acción -->
        <button id="spin-btn" class="w-full bg-gradient-to-r from-red-600 to-amber-500 hover:from-red-500 hover:to-amber-400 disabled:from-slate-800 disabled:to-slate-800 disabled:text-slate-600 text-slate-950 font-black text-xl py-4 px-8 rounded-xl uppercase tracking-widest shadow-lg shadow-red-900/30 active:scale-98 transition-all cursor-pointer disabled:cursor-not-allowed lg:col-start-2 lg:row-start-4 lg:self-start">
            Spin Roulette
        </button>
        </div>
    </main>

    <!-- Ban List Modal -->
    <div id="ban-modal" class="hidden fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-sm p-0 sm:p-4 items-end sm:items-center justify-center" role="dialog" aria-modal="true" aria-labelledby="ban-modal-title">
        <section class="bg-slate-900 border border-slate-700 rounded-t-2xl sm:rounded-2xl shadow-2xl w-full max-w-2xl max-h-[92dvh] sm:max-h-[85vh] flex flex-col text-left">
            <header class="flex items-start justify-between gap-4 p-4 sm:p-5 border-b border-slate-800 shrink-0">
                <div>
                    <h2 id="ban-modal-title" class="text-xl font-black uppercase tracking-wide">Hero Ban List</h2>
                    <p class="text-sm text-slate-400 mt-1">Banned heroes will be excluded from future spins.</p>
                </div>
                <button id="close-ban-modal-btn" class="p-2 text-slate-400 hover:text-white cursor-pointer" aria-label="Close ban list">
                    <span aria-hidden="true" class="text-2xl leading-none">&times;</span>
                </button>
            </header>

            <div class="p-4 sm:p-5 pb-3 space-y-3 shrink-0">
                <label for="ban-search" class="sr-only">Search heroes</label>
                <input id="ban-search" type="search" placeholder="Search heroes..." autocomplete="off" class="w-full bg-slate-950 border border-slate-700 focus:border-amber-400 focus:outline-none rounded-lg px-4 py-3 text-sm text-white placeholder:text-slate-600">

                <div class="flex gap-2 overflow-x-auto pb-1" aria-label="Filter ban list by role">
                    <button data-ban-role="All" class="ban-role-filter shrink-0 px-3 py-2 rounded-lg border text-[10px] font-bold uppercase tracking-wider cursor-pointer transition-colors">All</button>
                    <button data-ban-role="Vanguard" class="ban-role-filter shrink-0 px-3 py-2 rounded-lg border text-[10px] font-bold uppercase tracking-wider cursor-pointer transition-colors">Vanguard</button>
                    <button data-ban-role="Duelist" class="ban-role-filter shrink-0 px-3 py-2 rounded-lg border text-[10px] font-bold uppercase tracking-wider cursor-pointer transition-colors">Duelist</button>
                    <button data-ban-role="Strategist" class="ban-role-filter shrink-0 px-3 py-2 rounded-lg border text-[10px] font-bold uppercase tracking-wider cursor-pointer transition-colors">Strategist</button>
                </div>

                <p id="ban-warning" class="hidden rounded-lg border border-amber-700/60 bg-amber-950/30 px-3 py-2 text-xs text-amber-300" role="status"></p>
            </div>

            <div id="ban-hero-list" class="grid grid-cols-1 min-[420px]:grid-cols-2 sm:grid-cols-3 gap-2 px-4 sm:px-5 pb-4 overflow-y-auto min-h-0"></div>
            <p id="ban-empty-state" class="hidden px-5 pb-6 text-sm text-center text-slate-500">No heroes match this search and role filter.</p>

            <footer class="flex items-center justify-between gap-3 p-4 sm:p-5 border-t border-slate-800 shrink-0">
                <p id="ban-summary" class="text-sm text-slate-400">No heroes banned</p>
                <button id="clear-bans-btn" class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-slate-200 text-xs font-bold uppercase tracking-wide cursor-pointer disabled:cursor-not-allowed">
                    Clear All
                </button>
            </footer>
        </section>
    </div>

    <script src="data/heroes.js"></script>
    <script src="services/practiceStorage.js"></script>
    <script src="services/preferencesStorage.js"></script>
    <script src="services/heroSelector.js"></script>
    <script src="app.js"></script>
</body>
</html>
